name: Golden Staleness Check

# Sprint 28 Priority 8: regenerate every committed MCP golden via the canonical
# emit and fail the PR if any non-allowlisted golden drifted, so silent golden
# drift (the cesam/fawley/korcge/dinam noise that recurred across Sprint 27) is
# caught at review time.
#
# Sprint 37 P7: this workflow runs on EVERY pull request and decides internally
# whether the sweep applies (see the "Decide whether to run" step). The path
# filter used to live in an `on.pull_request.paths:` block, but a path-filtered
# workflow simply does not trigger on unrelated PRs — and a *required* status
# check that never reports blocks the PR forever at "Expected — waiting for
# status to be reported" (with enforce_admins on, unoverridably). Filtering
# inside the job means the check always reaches a conclusion: seconds and green
# on a docs PR, the full ~25-minute sweep on an emit PR. That is the
# precondition for adding this to required_status_checks.contexts as
# "Golden staleness (emit regen + byte-diff)".

on:
  pull_request:
    branches: [main]

# A later push to the same PR cancels the in-flight run.
concurrency:
  group: golden-staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-staleness:
    name: Golden staleness (emit regen + byte-diff)
    runs-on: ubuntu-latest
    # Emit-only regen (no GAMS solve); dominated by ~8 slow-emit models
    # (ganges/gangesx ~minutes each), parallelized to ~6 workers so wall-clock
    # is bounded by the slowest single model. Generous ceiling.
    timeout-minutes: 25

    permissions:
      contents: read
      # Least privilege: the job only reads PR labels and runs the checker.
      pull-requests: read

    steps:
      # Replaces the former `on.pull_request.paths:` filter AND the skip-label
      # check. Both now resolve to one boolean so the job always reports.
      - name: Decide whether to run
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request?.labels?.map(l => l.name) || [];
            if (labels.includes('skip-golden-staleness')) {
              core.notice('skip-golden-staleness label present — reporting success without sweeping.');
              core.setOutput('run', 'false');
              return;
            }
            // Mirrors the paths: block this replaced. Keep in sync with the
            // emit surfaces the goldens are generated from.
            const PATTERNS = [
              /^src\/(ad|kkt|emit|ir)\/.*\.py$/,
              /^scripts\/sprint_audit\/check_golden_staleness\.py$/,
              /^scripts\/sprint_audit\/golden_staleness_allowlist\.txt$/,
              /^\.github\/workflows\/golden-staleness\.yml$/,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const hits = files
              .map((f) => f.filename)
              .filter((n) => PATTERNS.some((re) => re.test(n)));
            if (hits.length === 0) {
              core.notice(
                `No emit-affecting paths in ${files.length} changed file(s) — reporting success without sweeping.`,
              );
              core.setOutput('run', 'false');
              return;
            }
            core.notice(`Emit-affecting change detected (${hits.length}): ${hits.join(', ')}`);
            core.setOutput('run', 'true');

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # The GAMSLib raw corpus is gitignored; the check skips any golden whose
      # raw source is absent. Provision it so the gate is NOT a silent no-op.
      # No GAMS needed — this is emit-only (no solve).
      #
      # Sprint 37 P7: this used to run in the script's DEFAULT `convex` mode,
      # which selects 135 models by design — so the sweep discovered 148 of the
      # 170 committed goldens and reported PASS, silently skipping 18. Those 18
      # are not incidental: they include `iobalance` (the model whose value
      # coincidence refuted the second markov discriminator design), `orani` (in
      # the 15-model false-positive set of the naive predicate), and the 2-D
      # cohort members ps2_f_s / ps2_s / ps3_s_gic. A markov or fawley predicate
      # regressing onto exactly those models would have passed CI. `--all`
      # provisions the full 219 (~1 extra minute); `--min-scope` below asserts it
      # actually happened.
      - name: Download GAMSLib raw corpus
        if: steps.gate.outputs.run == 'true'
        # download_gamslib_raw.sh exits non-zero if ANY model fails to download;
        # warn-and-continue on partial failures (mirrors nightly.yml) so a
        # transient gams.com/network hiccup doesn't fail the gate — the next step
        # still fails fast if ZERO models were provisioned.
        run: |
          if ! ./scripts/download_gamslib_raw.sh --all; then
            echo "::warning::download_gamslib_raw.sh reported one or more download failures; continuing with whatever was fetched."
          fi

      - name: Report provisioned corpus size
        if: steps.gate.outputs.run == 'true'
        run: |
          n=$(ls data/gamslib/raw/*.gms 2>/dev/null | wc -l)
          echo "Provisioned $n raw model(s)."
          test "$n" -gt 0 || { echo "ERROR: no raw corpus — the staleness gate would be a no-op."; exit 1; }

      # --min-scope is the coverage floor: discover_goldens() drops any golden
      # whose raw source is absent, so an under-provisioned corpus narrows the
      # sweep while still reporting PASS.
      #
      # DERIVED from `git ls-files`, not hard-coded, and not from the filesystem.
      # The filesystem count is the SAME quantity discover_goldens() starts from
      # (it globs data/gamslib/mcp/), so asserting against it would compare a
      # number to itself and always pass -- the self-certification defect this
      # gate exists to prevent, reappearing inside its own guard. `git ls-files`
      # is independent: it counts what is COMMITTED regardless of whether the raw
      # corpus was provisioned, which is precisely the failure being caught.
      #
      # Self-maintaining: adopting goldens raises the floor in the same commit
      # that adds them, so the assertion can never lag the corpus. Deleting a
      # committed golden lowers it, which remains the intended forcing function.
      - name: Run golden-staleness check
        if: steps.gate.outputs.run == 'true'
        run: |
          MIN_SCOPE=$(git ls-files 'data/gamslib/mcp/*.gms' | wc -l | tr -d ' ')
          test "$MIN_SCOPE" -gt 0 || { echo "ERROR: git ls-files found no goldens — the floor would be vacuous."; exit 1; }
          echo "Coverage floor derived from git ls-files: $MIN_SCOPE committed golden(s)."
          python scripts/sprint_audit/check_golden_staleness.py \
            --min-scope "$MIN_SCOPE" --json golden-staleness.json
