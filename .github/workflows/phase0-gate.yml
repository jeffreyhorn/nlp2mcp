name: Phase-0 Gate

# Sprint 37 P7: enforce CONTRIBUTING.md §392-447 — any PR touching
# src/{ad,kkt,emit} must carry a docs/issues/ISSUE_<N>_*.md with a
# `## Phase 0: Acceptance Gate` section, BEFORE the src/ commit lands.
#
# Measured compliance over the three most recent emit-touching PRs before this
# check existed: 1 of 3, and that one only after a reviewer asked (#1647).
# Verified against real history: this gate FAILS #1620 and #1596 (no Phase-0
# doc) and PASSES #1647, #1665, #1671.
#
# NOTE ON THE TRIGGER: this runs on EVERY pull request and decides internally,
# rather than using an `on.pull_request.paths:` filter. A path-filtered workflow
# does not trigger on unrelated PRs, and a *required* status check that never
# reports blocks the PR forever at "Expected — waiting for status to be
# reported" (with enforce_admins on, unoverridably). This is the same correction
# already applied to golden-staleness.yml in Sprint 37.

on:
  pull_request:
    branches: [main]

concurrency:
  group: phase0-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0-gate:
    name: Phase-0 acceptance gate (emit-touching PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check skip label
        id: skip
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request?.labels?.map(l => l.name) || [];
            const skip = labels.includes('skip-phase0');
            if (skip) {
              core.notice('skip-phase0 label present — exception-scope PR, reporting success.');
            }
            core.setOutput('skip', skip ? 'true' : 'false');

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the PR's changed files and body
        if: steps.skip.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            fs.writeFileSync('changed_files.txt', files.map(f => f.filename).join('\n'));
            fs.writeFileSync('pr_body.txt', context.payload.pull_request.body || '');
            core.info(`Collected ${files.length} changed file(s).`);

      - name: Run the Phase-0 gate
        if: steps.skip.outputs.skip != 'true'
        run: |
          python scripts/sprint_audit/check_phase0_doc.py \
            --changed-files changed_files.txt \
            --pr-body pr_body.txt \
            --json phase0-gate.json
